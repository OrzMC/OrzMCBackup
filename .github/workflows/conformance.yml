name: conformance

# 语言无关一致性门禁（spec/SPEC.md WOS-12）。
# 红 = 阻断合并（配合分支保护把本 workflow 设为 required check）。
on:
  # Runs on every push/PR (no path filter) on purpose: this workflow is the
  # required status check for merging, and a workflow that never runs leaves the
  # check pending forever on docs-only PRs.
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6.4.1
      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Vectors are reproducible
        run: |
          python3 spec/tools/make_vectors.py --force
          git diff --exit-code -- spec/vectors || {
            echo "::error::spec/vectors is out of date; run spec/tools/make_vectors.py and commit";
            exit 1;
          }
      - name: Clause coverage (report-only)
        run: python3 spec/tools/coverage.py
      - name: Conformance (java + rust)
        run: ./scripts/conformance.sh all
      - name: Upload conformance artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: conformance-artifacts
          path: |
            /tmp/conformance-*
          if-no-files-found: ignore
