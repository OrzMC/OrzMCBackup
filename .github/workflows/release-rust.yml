name: release-rust

on:
  push:
    tags:
      - 'rust-v*'
  # 手动 dry-run：只构建/打包并上传 workflow artifacts，不创建 Release、不动 homebrew。
  # 对应父仓库 AGENTS「发版前必跑 dry-run」。
  workflow_dispatch:
    inputs:
      mode:
        description: 'build-only = 构建 6 平台产物（不发布）；homebrew = 只回填/修复 formula'
        type: choice
        options: [build-only, homebrew]
        default: build-only
      tag:
        description: 'homebrew 模式的目标 tag（如 rust-v0.0.4）；push 时忽略'
        required: false
        type: string
      version:
        description: '版本号（留空则用 rust/Cargo.toml 的 version）'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Fail fast if the release tag doesn't match the Cargo.toml version, so the
  # published binary's `--version` always agrees with the release tag.
  validate-version:
    if: github.event_name == 'push' || inputs.mode != 'homebrew'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7
      - name: Ensure tag matches rust/Cargo.toml version
        run: |
          ver=$(grep -E '^version\s*=' Cargo.toml | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ "${{ github.event_name }}" = "push" ]; then
            tag="${GITHUB_REF_NAME#rust-v}"
            if [ "$ver" != "$tag" ]; then
              echo "Release tag '${GITHUB_REF_NAME}' does not match rust/Cargo.toml version '$ver' (expected tag rust-v$ver)." >&2
              exit 1
            fi
            echo "OK: tag '${GITHUB_REF_NAME}' matches rust/Cargo.toml version '$ver'"
          else
            req="${{ inputs.version }}"
            req="${req:-$ver}"
            if [ "$ver" != "$req" ]; then
              echo "Requested version '$req' does not match rust/Cargo.toml version '$ver'." >&2
              exit 1
            fi
            echo "DRY-RUN: building $ver (nothing will be published)"
          fi

  build:
    needs: validate-version
    if: github.event_name == 'push' || inputs.mode != 'homebrew'
    name: build (${{ matrix.target }})
    defaults:
      run:
        working-directory: rust
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS：macos-latest 为 arm64 原生，x86_64 走交叉编译
          - target: aarch64-apple-darwin
            os: macos-latest
            exe: ""
            archive_ext: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            exe: ""
            archive_ext: tar.gz
          # Linux：x86_64 原生，aarch64 走交叉编译（需要 gcc-aarch64-linux-gnu）
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            exe: ""
            archive_ext: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            exe: ""
            archive_ext: tar.gz
          # Windows：x86_64 原生，aarch64 交叉编译（windows-latest 已预装 ARM64 MSVC 工具链）
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            exe: .exe
            archive_ext: zip
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            exe: .exe
            archive_ext: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Determine product name
        id: product
        shell: bash
        run: |
          echo "product_name=$(grep -E '^name\s*=\s*"' Cargo.toml | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')" >> "$GITHUB_OUTPUT"

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          rustflags: ""

      - name: Add Rust target
        run: rustup target add "${{ matrix.target }}"

      - uses: Swatinem/rust-cache@v2

      - name: Install aarch64 Linux linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build
        run: cargo build --release --locked --target "${{ matrix.target }}"

      - name: Package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          name="${{ steps.product.outputs.product_name }}"
          # On a tag push use the tag (rust-vX.Y.Z); on workflow_dispatch (dry-run) fall back to
          # Cargo.toml so artifact names stay meaningful.
          ver="${GITHUB_REF_NAME#rust-v}"
          if [ "$ver" = "$GITHUB_REF_NAME" ]; then
            ver=$(grep -E '^version\s*=' Cargo.toml | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          exe="${{ matrix.exe }}"
          bin="target/${{ matrix.target }}/release/${name}${exe}"
          if [ ! -f "$bin" ]; then
            echo "Expected binary not found: $bin" >&2
            exit 1
          fi
          mkdir -p dist
          cp "$bin" "dist/${name}${exe}"
          cp README.md dist/ || true
          if [ -f LICENSE ]; then cp LICENSE dist/; fi
          archive="$name-$ver-${{ matrix.target }}.${{ matrix.archive_ext }}"
          if [ "${{ matrix.archive_ext }}" = "zip" ]; then
            powershell -NoProfile -Command "Compress-Archive -Path 'dist/*' -DestinationPath '$archive' -Force"
          else
            tar -C dist -czf "$archive" .
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: tarball-${{ matrix.target }}
          path: rust/${{ steps.product.outputs.product_name }}-${{ steps.package.outputs.version }}-${{ matrix.target }}.${{ matrix.archive_ext }}

  publish-release:
    needs: build
    # dry-run (workflow_dispatch) stops after building + uploading workflow artifacts
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      # Needed at job level so the `if:` on the publish step can see it (GitHub does not
      # expose secrets directly inside step conditions).
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    outputs:
      sha_arm64: ${{ steps.compute-sha.outputs.sha_arm64 }}
      sha_x64: ${{ steps.compute-sha.outputs.sha_x64 }}
      sha_linux_x64: ${{ steps.compute-sha.outputs.sha_linux_x64 }}
      sha_linux_arm64: ${{ steps.compute-sha.outputs.sha_linux_arm64 }}
    steps:
      - uses: actions/checkout@v7

      - name: Determine product name
        id: product
        run: |
          echo "product_name=$(grep -E '^name\s*=\s*"' Cargo.toml | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')" >> "$GITHUB_OUTPUT"

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: tarball-*
          merge-multiple: true
          path: dist

      - name: Compute SHA256 values
        id: compute-sha
        run: |
          name="${{ steps.product.outputs.product_name }}"
          # On a tag push use the tag (rust-vX.Y.Z); on workflow_dispatch (dry-run) fall back to
          # Cargo.toml so artifact names stay meaningful.
          ver="${GITHUB_REF_NAME#rust-v}"
          if [ "$ver" = "$GITHUB_REF_NAME" ]; then
            ver=$(grep -E '^version\s*=' Cargo.toml | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          fi
          tag="$ver"
          cd dist
          {
            echo "sha_arm64=$(sha256sum "$name-$tag-aarch64-apple-darwin.tar.gz" | cut -d ' ' -f1)"
            echo "sha_x64=$(sha256sum "$name-$tag-x86_64-apple-darwin.tar.gz" | cut -d ' ' -f1)"
            echo "sha_linux_x64=$(sha256sum "$name-$tag-x86_64-unknown-linux-gnu.tar.gz" | cut -d ' ' -f1)"
            echo "sha_linux_arm64=$(sha256sum "$name-$tag-aarch64-unknown-linux-gnu.tar.gz" | cut -d ' ' -f1)"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            安装：`cargo install rust-thanos` / `brew install rust-thanos` / 下方预编译资产。
            完整变更与升级须知见仓库 CHANGELOG 的 `rust-v0.0.4` 一节。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish crate to crates.io
        # Runs after the GitHub Release so a registry hiccup cannot hide the artifacts.
        # Skipped automatically when the (org) secret is not exposed to this repository.
        if: env.CARGO_REGISTRY_TOKEN != ''
        working-directory: rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked

  update-homebrew-tap:
    needs: publish-release
    # Tag push → normal release path; workflow_dispatch with mode=homebrew → backfill/repair the
    # formula for an already published tag (no rebuild, no re-publish).
    if: |
      always() && (
        github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' && inputs.mode == 'homebrew')
      )
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
    steps:
      - name: Check tap credentials
        id: guard
        env:
          TAP_REPO: ${{ secrets.HOMEBREW_TAP_REPO }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_REPO_TOKEN }}
        run: |
          if [ -z "$TAP_REPO" ] || [ -z "$TAP_TOKEN" ]; then
            echo "::notice::Homebrew tap secrets (HOMEBREW_TAP_REPO / HOMEBREW_TAP_REPO_TOKEN) are not exposed to this repository; skipping the formula update."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout main repo
        if: steps.guard.outputs.skip != 'true' 
        uses: actions/checkout@v7
        with:
          path: main
      - name: Set up Rust toolchain (for formula bins)
        if: steps.guard.outputs.skip != 'true'
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          rustflags: ""
      - name: Determine product name
        id: product_main
        if: steps.guard.outputs.skip != 'true' 
        run: |
          cd main/rust
          name=$(grep -E '^name\s*=\s*"' Cargo.toml | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          desc=$(grep -E '^description\s*=\s*"' Cargo.toml | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "product_name=$name" >> "$GITHUB_OUTPUT"
          echo "product_desc=${desc:-$name}" >> "$GITHUB_OUTPUT"
      - name: Build formula metadata
        if: steps.guard.outputs.skip != 'true'
        id: formula
        run: |
          pname="${{ steps.product_main.outputs.product_name }}"
          class=$(echo "$pname" | awk -F'[-_]' '{for(i=1;i<=NF;i++){printf toupper(substr($i,1,1)) tolower(substr($i,2))}}')
          echo "formula_class=$class" >> "$GITHUB_OUTPUT"
      # (Formerly a "Determine binary list" step ran a full `cargo build` here, but the template
      # only needs the product name for `bin.install`; dropping it takes ~1-2 min off every release
      # and makes `mode=homebrew` backfills fast.)
      - name: Resolve asset digests
        id: sha
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The sha256 values are taken from the release itself (GitHub asset digest, or a download
          # as fallback). Doing it here — instead of reusing publish-release outputs — is what makes
          # `mode=homebrew` backfills work: that job does not run on a manual dispatch.
          ver="${TAG#rust-v}"
          name_prefix="${{ steps.product_main.outputs.product_name }}-$ver"
          for pair in \
            "sha_arm64:aarch64-apple-darwin" \
            "sha_x64:x86_64-apple-darwin" \
            "sha_linux_x64:x86_64-unknown-linux-gnu" \
            "sha_linux_arm64:aarch64-unknown-linux-gnu"; do
            key="${pair%%:*}"; target="${pair##*:}"
            asset="${name_prefix}-${target}.tar.gz"
            digest=$(gh api "repos/${{ github.repository }}/releases/tags/${TAG}" \
              --jq ".assets[] | select(.name==\"${asset}\") | .digest" 2>/dev/null || true)
            if [ -z "$digest" ] || [ "$digest" = "null" ]; then
              tmp=$(mktemp)
              curl -fsSL -o "$tmp" "https://github.com/${{ github.repository }}/releases/download/${TAG}/${asset}" \
                || { echo "::error::cannot download ${asset}"; exit 1; }
              digest="sha256:$(shasum -a 256 "$tmp" | awk '{print $1}')"
              rm -f "$tmp"
            fi
            echo "${key}=${digest#sha256:}" >> "$GITHUB_OUTPUT"
          done
      - name: Prepare URLs
        if: steps.guard.outputs.skip != 'true'
        id: prep
        run: |
          {
            if [ -z "${TAG:-}" ]; then
              echo "::error::TAG is empty (pass inputs.tag when using mode=homebrew)"; exit 1
            fi
            ver="${TAG#rust-v}"
            echo "version=$ver" >> "$GITHUB_OUTPUT"
            echo "url_arm64=https://github.com/${{ github.repository }}/releases/download/$TAG/${{ steps.product_main.outputs.product_name }}-$ver-aarch64-apple-darwin.tar.gz"
            echo "url_x64=https://github.com/${{ github.repository }}/releases/download/$TAG/${{ steps.product_main.outputs.product_name }}-$ver-x86_64-apple-darwin.tar.gz"
            echo "url_linux_x64=https://github.com/${{ github.repository }}/releases/download/$TAG/${{ steps.product_main.outputs.product_name }}-$ver-x86_64-unknown-linux-gnu.tar.gz"
            echo "url_linux_arm64=https://github.com/${{ github.repository }}/releases/download/$TAG/${{ steps.product_main.outputs.product_name }}-$ver-aarch64-unknown-linux-gnu.tar.gz"
          } >> "$GITHUB_OUTPUT"
      - name: Verify Tap Repo variable
        if: steps.guard.outputs.skip != 'true'
        id: tap
        run: |
          if [ -z "${{ secrets.HOMEBREW_TAP_REPO }}" ]; then
            echo "HOMEBREW_TAP_REPO secret is not set. Please add it in Repository Settings → Secrets and variables → Actions." >&2
            exit 1
          fi
          echo "repo=${{ secrets.HOMEBREW_TAP_REPO }}" >> "$GITHUB_OUTPUT"
      - name: Verify Tap Repo token
        if: steps.guard.outputs.skip != 'true'
        run: |
          if [ -z "${{ secrets.HOMEBREW_TAP_REPO_TOKEN }}" ]; then
            echo "HOMEBREW_TAP_REPO_TOKEN secret is not set. Please add it in Repository Settings → Secrets and variables → Actions." >&2
            exit 1
          fi
      - name: Checkout tap repo
        if: steps.guard.outputs.skip != 'true'
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.tap.outputs.repo }}
          token: ${{ secrets.HOMEBREW_TAP_REPO_TOKEN }}
          path: tap
      - name: Render formula
        if: steps.guard.outputs.skip != 'true'
        run: |
          tpl="main/.github/homebrew_formula.rb.tpl"
          out="tap/Formula/${{ steps.product_main.outputs.product_name }}.rb"
          cp "$tpl" "$out"
          sed -i.bak -e "s|FORMULA_INSTALLS|bin.install \"${{ steps.product_main.outputs.product_name }}\"|" "$out"
          sed -i.bak \
            -e "s/FORMULA_CLASS/${{ steps.formula.outputs.formula_class }}/" \
            -e "s/FORMULA_DESC/${{ steps.product_main.outputs.product_desc }}/" \
            -e "s|FORMULA_HOME|https://github.com/${{ github.repository }}|" \
            -e "s/FORMULA_VER/${{ steps.prep.outputs.version }}/" \
            -e "s|URL_ARM|${{ steps.prep.outputs.url_arm64 }}|" \
            -e "s|URL_X64|${{ steps.prep.outputs.url_x64 }}|" \
            -e "s|URL_LINUX_X64|${{ steps.prep.outputs.url_linux_x64 }}|" \
            -e "s|URL_LINUX_ARM64|${{ steps.prep.outputs.url_linux_arm64 }}|" \
            -e "s/SHA_ARM/${{ steps.sha.outputs.sha_arm64 }}/" \
            -e "s/SHA_X64/${{ steps.sha.outputs.sha_x64 }}/" \
            -e "s/SHA_LINUX_X64/${{ steps.sha.outputs.sha_linux_x64 }}/" \
            -e "s/SHA_LINUX_ARM64/${{ steps.sha.outputs.sha_linux_arm64 }}/" "$out"
      - name: Commit & push
        if: steps.guard.outputs.skip != 'true'
        run: |
          cd tap
          if grep -q 'sha256 ""' "Formula/${{ steps.product_main.outputs.product_name }}.rb"; then
            echo "::error::rendered formula contains an empty sha256 — refusing to commit"; exit 1
          fi
          if [ -z "$(git status --porcelain)" ]; then
            echo "::notice::Formula for ${TAG} is already up to date; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add "Formula/${{ steps.product_main.outputs.product_name }}.rb"
          git commit -m "${{ steps.product_main.outputs.product_name }} ${TAG}"
          git push
