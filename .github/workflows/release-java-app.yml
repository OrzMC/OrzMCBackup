name: release-java-app

on:
  push:
    tags:
      - 'java-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.2.3)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  app:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/java-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate release tag format
        if: github.event_name == 'push'
        run: |
          TAG="${{ github.ref_name }}"
          if [[ ! "$TAG" =~ ^java-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Invalid tag: $TAG (expected java-vX.Y.Z)"
            exit 1
          fi
          echo "✅ Tag format valid: $TAG (java)"
      - name: Set version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ inputs.version }}" >> $GITHUB_ENV
          else
            echo "VERSION=${GITHUB_REF_NAME#java-v}" >> $GITHUB_ENV
          fi
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6.4.1
      - name: Run lint gates
        # C11: tag push 不触发 test-matrix，release 自带 ktlint/detekt 门禁
        run: java/gradlew -p java ktlintCheck detekt --no-daemon
      - name: Run unit tests
        run: java/gradlew -p java :core:test :app:test --no-daemon -Pversion=${{ env.VERSION }}
      - name: Build app shadowJar
        run: java/gradlew -p java :app:shadowJar --no-daemon -Pversion=${{ env.VERSION }}
      - name: Generate app checksum
        run: |
          # 产物文件名固定为 backup.jar（版本写入 manifest），见 app/build.gradle.kts shadowJar
          APP_JAR="java/app/build/libs/backup.jar"
          test -s "${APP_JAR}" || { echo "missing app jar: ${APP_JAR}"; exit 1; }
          sha256sum "${APP_JAR}" | awk '{print $1}' > "${APP_JAR}.sha256"
      - name: Upload app artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-backup-${{ env.VERSION }}
          path: |
            java/app/build/libs/backup.jar
            java/app/build/libs/backup.jar.sha256
      - name: Publish GitHub Release (app)
        if: startsWith(github.ref, 'refs/tags/java-v')
        uses: softprops/action-gh-release@v3
        with:
          # The triggering tag is already `java-vX.Y.Z` — do not invent a second one.
          name: OrzMCBackup CLI v${{ env.VERSION }}
          body: |
            安装：下载下方 `backup.jar`（`java -jar backup.jar --help`）；库：`io.github.wangzhizhou:backup-core:${{ env.VERSION }}`（Maven Central）。

            ## 升级须知
            - **无法解析的 region 不再静默消失**：非原地备份时，头部损坏/读取失败的 region 及其
              `entities`/`poi` 兄弟文件会被**原样复制**到输出，并记录错误。此前该 region 会从备份中缺失。
            - 自动化脚本建议始终加 `--strict`（非 strict 下即使记录到错误，退出码仍为 0）。

            ## 新增
            - `merge --dry-run` + `--diff-file`：预览槽位级合并决策并输出 chunk 级回退清单（不写任何文件）。
            - `RangePattern` 回归 + `FilterOptions.extraPatterns`：库可注入自定义保留模式。
            - 一致性门禁：`scripts/conformance.sh`（Java/Rust/上游 PHP 三方对齐 24 个向量）。

            完整变更见仓库 `CHANGELOG.md` 的 `v${{ env.VERSION }}` 一节。
          files: |
            java/app/build/libs/backup.jar
            java/app/build/libs/backup.jar.sha256
      - run: java/gradlew -p java --stop
