name: rust

on:
  # No path filters on purpose: these jobs carry *required* status checks, and a
  # workflow that does not run leaves the check pending forever (a rust-only PR
  # would block on the java matrix and vice versa).
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: rust

jobs:
  build-lint-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          components: clippy, rustfmt
          # v2 默认 rustflags: -D warnings；cargo 新增的 dependency lint 会把它变成硬失败。
          # 风格/lint 门禁由 rustfmt + clippy(-D warnings) 显式负责。
          rustflags: ""
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Show environment
        run: |
          rustc -Vv
          cargo -Vv
        env:
          CARGO_TERM_COLOR: always
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Verify lockfile
        run: cargo check --locked
      - name: Build
        run: cargo build --verbose
      - name: Test
        run: cargo test --verbose
        env:
          RUST_BACKTRACE: full
