[package]
name = "rust-thanos"
version = "0.0.5"
edition = "2021"
license = "Apache-2.0"
description = "An efficient Minecraft Java world optimization tool to detect and remove unused chunks"
repository = "https://github.com/OrzMC/OrzMCBackup"
documentation = "https://github.com/OrzMC/OrzMCBackup/tree/main/rust"
readme = "README.md"
keywords = ["minecraft", "world", "optimization", "chunks", "rust"]
categories = ["command-line-utilities", "games", "filesystem"]
# Test fixtures are ~34 MB of real world data; they are needed to run the test suite in the
# repository but must not be shipped in the crate (crates.io upload limit is 10 MB).
exclude = ["tests/Fixtures/**", "docs/**", "bench/**"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rayon = "1"
flate2 = { version = "1", features = ["zlib"] }
lz4_flex = "0.14"
fastnbt = "2"
byteorder = "1"
regex = "1"
uuid = { version = "1", features = ["v4"] }
xxhash-rust = { version = "0.8", features = ["xxh32"] }
log = "0.4"
env_logger = "0.11"
indicatif = "0.18"
console = "0.16"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
zip = "9"

[dev-dependencies]
# Test-only helpers: copying fixture worlds and walking temp trees.
walkdir = "2"
fs_extra = "1"
